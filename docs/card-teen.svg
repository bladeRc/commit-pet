<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Pipko the Teen: hyped!, 99% fed, 14-day streak">
<title>Pipko the Teen</title>
<style>
svg { --bg:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#59636e;--track:#eaeef2;--food:#1a7f37;--pet:#3178c6; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117;--border:#30363d;--text:#e6edf3;--muted:#9198a1;--track:#21262d;--food:#3fb950;--pet:#3178c6; } }
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.art { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 700; fill: var(--pet); }
.name { font-size: 18px; font-weight: 700; }
.mood { font-size: 13px; fill: var(--muted); }
.label, .value { font-size: 12px; fill: var(--muted); }
.facts { font-size: 12px; fill: var(--muted); }
.speech { font-size: 11.5px; font-style: italic; fill: var(--muted); }
.fill { transform-box: fill-box; transform-origin: left; animation: grow 0.9s ease-out both; }
.fill.food { fill: var(--food); }
.fill.xp { fill: var(--pet); }
.pet { animation: bob 0.9s ease-in-out infinite; }
.pet.hungry { animation-name: wiggle; }
.closed { opacity: 0; animation: blink 4s infinite; }
.open { animation: unblink 4s infinite; }
.float { animation: bob 3s ease-in-out infinite; opacity: 0.7; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes wiggle { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
@keyframes blink { 0%, 93%, 100% { opacity: 0; } 95%, 98% { opacity: 1; } }
@keyframes unblink { 0%, 93%, 100% { opacity: 1; } 95%, 98% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .closed { opacity: 0; } }
</style>
<rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="var(--bg)" stroke="var(--border)"/>
<rect x="12" y="12" width="170" height="171" rx="8" fill="var(--pet)" fill-opacity="0.09"/>
<line x1="30" x2="164" y1="161" y2="161" stroke="var(--pet)" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
<g class="pet hyped"><text class="art open" text-anchor="middle" xml:space="preserve"><tspan x="97" y="64">             </tspan><tspan x="97" y="81">   .-----.   </tspan><tspan x="97" y="98">  ( *   * )  </tspan><tspan x="97" y="115">  (   D   )  </tspan><tspan x="97" y="132">   \_____/   </tspan><tspan x="97" y="149">    ^   ^    </tspan></text><text class="art closed" text-anchor="middle" xml:space="preserve"><tspan x="97" y="64">             </tspan><tspan x="97" y="81">   .-----.   </tspan><tspan x="97" y="98">  ( -   - )  </tspan><tspan x="97" y="115">  (   D   )  </tspan><tspan x="97" y="132">   \_____/   </tspan><tspan x="97" y="149">    ^   ^    </tspan></text></g>
<text class="name" x="200" y="38">Pipko the Teen</text>
<text class="mood" x="200" y="59">hyped!  ^o^</text>
<text class="label" x="200" y="84">food</text><rect x="252" y="76" width="160" height="9" rx="4.5" fill="var(--track)"/><rect class="fill food" style="animation-delay:0s" x="252" y="76" width="158.4" height="9" rx="4.5"/><text class="value" x="481" y="84" text-anchor="end">99%</text>
<text class="label" x="200" y="108">xp</text><rect x="252" y="100" width="160" height="9" rx="4.5" fill="var(--track)"/><rect class="fill xp" style="animation-delay:0.15s" x="252" y="100" width="21.3" height="9" rx="4.5"/><text class="value" x="481" y="108" text-anchor="end">210/600 xp</text>
<text class="label" x="200" y="136">streak</text>
<text class="value" x="252" y="136">🔥 14 days  ·  best 14</text>
<text class="facts" x="200" y="160">14 commits  ·  13 days old  ·  TypeScript</text>
<text class="speech" x="200" y="180">“14-day streak. Unstoppable.”</text>
</svg>
