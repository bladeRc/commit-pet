<text class="label" x="200" y="108">xp</text><rect x="252" y="100" width="160" height="9" rx="4.5" fill="var(--track)"/><rect class="fill xp" style="animation-delay:0.15s" x="252" y="100" width="160.0" height="9" rx="4.5"/><text class="value" x="481" y="108" text-anchor="end">9000 xp</text>
