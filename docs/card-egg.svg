<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Bix the Egg: waiting to hatch, 100% fed, 0-day streak">
<title>Bix the Egg</title>
<style>
svg { --bg:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#59636e;--track:#eaeef2;--food:#1a7f37;--pet:#8957e5; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117;--border:#30363d;--text:#e6edf3;--muted:#9198a1;--track:#21262d;--food:#3fb950;--pet:#8957e5; } }
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.name { font-size: 18px; font-weight: 700; }
.mood { font-size: 13px; fill: var(--muted); }
.label, .value { font-size: 12px; fill: var(--muted); }
.facts { font-size: 12px; fill: var(--muted); }
.speech { font-size: 11.5px; font-style: italic; fill: var(--muted); }
.fill { transform-box: fill-box; transform-origin: left; animation: grow 0.9s ease-out both; }
.fill.food { fill: var(--food); }
.fill.xp { fill: var(--pet); }
.pet { animation: hop 2.4s steps(1, end) infinite; }
.pet.hyped { animation-duration: 1.1s; }
.pet.sad { animation: none; }
.pet.hungry { animation: shake 2.6s steps(1, end) infinite; }
.pet.egg { animation: shake 3.2s steps(1, end) infinite; }
.closed { opacity: 0; animation: blink 3.6s steps(1, end) infinite; }
.spark { opacity: 0; animation: twinkle 1.8s ease-in-out infinite; }
.drop { opacity: 0; animation: fall 1.2s linear infinite; }
.bowl { animation: hop 1.6s steps(1, end) infinite; }
.float { animation: hop 3s steps(1, end) infinite; opacity: 0.8; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes hop { 0%, 60%, 85%, 100% { transform: translateY(0); } 65%, 80% { transform: translateY(-6px); } }
@keyframes shake { 0%, 70%, 86%, 100% { transform: translateX(0); } 72% { transform: translateX(-6px); } 76% { transform: translateX(6px); } 80% { transform: translateX(-6px); } 84% { transform: translateX(0); } }
@keyframes blink { 0% { opacity: 0; } 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
@keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
@keyframes fall { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(16px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .closed, .drop { opacity: 0; } .spark { opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="var(--bg)" stroke="var(--border)"/>
<rect x="12" y="12" width="170" height="171" rx="8" fill="var(--pet)" fill-opacity="0.09"/>
<line x1="24" x2="170" y1="161" y2="161" stroke="var(--pet)" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
<g shape-rendering="crispEdges"><g class="pet egg"><path fill="#342157" d="M85 94h24v6h-24zM73 100h12v6h-12zM109 100h12v6h-12zM67 106h6v6h-6zM121 106h6v6h-6zM61 112h6v6h-6zM127 112h6v6h-6zM61 118h6v6h-6zM127 118h6v6h-6zM61 124h6v6h-6zM127 124h6v6h-6zM61 130h6v6h-6zM127 130h6v6h-6zM61 136h6v6h-6zM127 136h6v6h-6zM67 142h6v6h-6zM121 142h6v6h-6zM73 148h12v6h-12zM109 148h12v6h-12zM85 154h24v6h-24z"/><path fill="#b89aef" d="M85 100h12v6h-12zM73 106h12v6h-12zM67 112h6v6h-6zM67 118h6v6h-6z"/><path fill="#8957e5" d="M97 100h12v6h-12zM85 106h36v6h-36zM73 112h54v6h-54zM73 118h6v6h-6zM91 118h36v6h-36zM67 124h36v6h-36zM115 124h12v6h-12zM67 130h60v6h-60zM73 136h6v6h-6zM91 136h30v6h-30zM79 142h36v6h-36z"/><path fill="#ffffff" d="M79 118h12v6h-12zM103 124h12v6h-12zM79 136h12v6h-12z"/><path fill="#6741ac" d="M67 136h6v6h-6zM121 136h6v6h-6zM73 142h6v6h-6zM115 142h6v6h-6zM85 148h24v6h-24z"/></g></g>
<text class="name" x="200" y="38">Bix the Egg</text>
<text class="mood" x="200" y="59">waiting to hatch  ( . )</text>
<text class="label" x="200" y="84">food</text><rect x="252" y="76" width="160" height="9" rx="4.5" fill="var(--track)"/><rect class="fill food" style="animation-delay:0s" x="252" y="76" width="160.0" height="9" rx="4.5"/><text class="value" x="481" y="84" text-anchor="end">100%</text>
<text class="label" x="200" y="108">xp</text><rect x="252" y="100" width="160" height="9" rx="4.5" fill="var(--track)"/><text class="value" x="481" y="108" text-anchor="end">0 xp</text>
<text class="label" x="200" y="136">streak</text>
<text class="value" x="252" y="136">🔥 0 days  ·  best 0</text>
<text class="facts" x="200" y="160">0 commits  ·  0 days old</text>
<text class="speech" x="200" y="180">“Make a commit to hatch me!”</text>
</svg>
