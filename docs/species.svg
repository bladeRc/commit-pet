<g style="--c:#8957e5;--cd:#8957e5">
<rect class="cell" x="516" y="306" width="158" height="138" rx="10"/>
<text class="art" text-anchor="middle" xml:space="preserve"><tspan x="595" y="341">   .-----.   </tspan><tspan x="595" y="355">  /  o o  \  </tspan><tspan x="595" y="369"> |    w    | </tspan><tspan x="595" y="383">  \_______/  </tspan></text>
<text class="name" x="595" y="418" text-anchor="middle">Blob</text>
<text class="lang" x="595" y="434" text-anchor="middle">everything else</text>
