<text class="art" text-anchor="middle" xml:space="preserve"><tspan x="425" y="41">    .---.    </tspan><tspan x="425" y="55">  .&apos; o o &apos;.  </tspan><tspan x="425" y="69"> (    w    ) </tspan><tspan x="425" y="83">  &apos;~~~~~~~&apos;  </tspan></text>
<text class="name" x="425" y="118" text-anchor="middle">Jello</text>
<text class="lang" x="425" y="134" text-anchor="middle">JavaScript</text>
