<text class="art" text-anchor="middle" xml:space="preserve"><tspan x="425" y="341">     _____   </tspan><tspan x="425" y="355">   _/#####\  </tspan><tspan x="425" y="369">  (o)w####|  </tspan><tspan x="425" y="383">   ^^-----^^ </tspan></text>
<text class="name" x="425" y="418" text-anchor="middle">Shelly</text>
<text class="lang" x="425" y="434" text-anchor="middle">Shell</text>
