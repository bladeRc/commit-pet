<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" aria-label="All commit-pet species">
<style>
svg { --bg:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#59636e; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --border:#30363d; --text:#e6edf3; --muted:#9198a1; } .art { fill: var(--cd) !important; } }
.cell { fill: var(--bg); stroke: var(--border); }
.art { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: var(--c); }
.name { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: var(--text); }
.lang { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: var(--muted); }
</style>
<g style="--c:#00a2ff;--cd:#00a2ff">
<rect class="cell" x="6" y="6" width="158" height="138" rx="10"/>
<text class="art" text-anchor="middle" xml:space="preserve"><tspan x="85" y="34">  +-------+  </tspan><tspan x="85" y="48">  | o   o |  </tspan><tspan x="85" y="62">  |   w   |  </tspan><tspan x="85" y="76">  +-------+  </tspan><tspan x="85" y="90">   |_| |_|   </tspan></text>
<text class="name" x="85" y="118" text-anchor="middle">Blox</text>
<text class="lang" x="85" y="134" text-anchor="middle">Luau / Lua</text>
</g>
<g style="--c:#3178c6;--cd:#3178c6">
<rect class="cell" x="176" y="6" width="158" height="138" rx="10"/>
