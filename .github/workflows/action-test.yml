name: Action test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          username: ${{ github.repository_owner }}
          out: test-card.svg
          commit: "false"
      - name: Check the card
        run: |
          head -c 300 test-card.svg
          grep -q "<svg" test-card.svg
      - uses: actions/upload-artifact@v4
        with:
          name: test-card
          path: test-card.svg
